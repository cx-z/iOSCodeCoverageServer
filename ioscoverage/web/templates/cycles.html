<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>iOS Coverage Cycles</title>
  <style>
__INLINE_CSS__
  </style>
</head>
<body>
  <header><div class="page row"><div><h1>iOS 真机覆盖率 Cycle</h1><div class="muted">提交 MR、复制 Cycle ID，并进入最新累计覆盖报告。</div></div><div id="identity" hidden><span id="current-user"></span> <span id="current-role" class="muted"></span> <a id="admin-users" href="/admin/users/" hidden>账号管理</a> <button id="logout" class="secondary" type="button">退出</button></div></div></header>
  <main class="page">
    <p id="page-error" class="error" role="alert" hidden></p>
    <section id="content" hidden>
      <section class="panel">
        <h2>从 MR 创建或打开 Cycle</h2>
        <p class="muted">支持已注册项目的 MR 详情、diffs 或 commits 页面 URL。</p>
        <form id="create-form" class="row"><input id="mr-url" type="url" required placeholder="https://git.example.com/group/project/merge_requests/42"><button type="submit">提交 MR</button></form>
        <div id="create-status" class="status-message"></div>
        <div id="created-cycle" class="row" hidden><span>Cycle ID：</span><code id="created-cycle-id"></code><button id="copy-created-cycle" class="secondary" type="button">复制 ID</button><button id="open-created-report" type="button">查看报告</button></div>
      </section>
      <section class="panel">
        <div class="row"><h2>Cycle 列表</h2><select id="project-filter"><option value="">全部项目</option></select><button id="refresh" class="secondary" type="button">刷新</button></div>
        <div class="table-wrap"><table><thead><tr><th>MR</th><th>目标分支</th><th>状态</th><th>Build / Run</th><th>提交账号</th><th>最近更新</th><th>Cycle ID</th><th>操作</th></tr></thead><tbody id="cycle-rows"></tbody></table></div>
        <div id="empty" class="empty" hidden>暂无已提交的 Cycle</div>
      </section>
    </section>
  </main>
  <script>
__INLINE_SCRIPT__
  </script>
</body>
</html>
